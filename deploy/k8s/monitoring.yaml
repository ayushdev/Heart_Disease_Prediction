apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: heart-risk
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-pod-discovery
  namespace: heart-risk
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-pod-discovery
  namespace: heart-risk
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: heart-risk
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-pod-discovery
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: heart-risk
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      serviceAccountName: prometheus
      securityContext: {runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534}
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
          ports:
            - containerPort: 9090
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
          livenessProbe:
            httpGet: {path: /-/healthy, port: 9090}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: heart-risk
spec:
  selector: {app: prometheus}
  ports:
    - {port: 9090, targetPort: 9090}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: heart-risk
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 472, fsGroup: 472}
      containers:
        - name: grafana
          image: grafana/grafana:12.2.0
          ports:
            - containerPort: 3000
          env:
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_LOG_MODE, value: console}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: grafana-admin, key: password}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: 3000}
            initialDelaySeconds: 30
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: datasource, mountPath: /etc/grafana/provisioning/datasources}
            - {name: provider, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dashboard, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - name: data
          emptyDir: {}
        - name: datasource
          configMap: {name: grafana-datasource}
        - name: provider
          configMap: {name: grafana-provider}
        - name: dashboard
          configMap: {name: grafana-dashboard}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: heart-risk
spec:
  selector: {app: grafana}
  ports:
    - {port: 3000, targetPort: 3000}