name: Train, verify, and deliver
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  MLFLOW_TRACKING_URI: sqlite:///mlflow.db
  MLFLOW_DISABLE_AGENT_HINT: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest test -q --junitxml=reports/tests.xml --cov=heart_risk --cov-report=xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quality-${{ matrix.os }}
          path: |
            reports/tests.xml
            coverage.xml

  train:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m heart_risk.data
      - run: python -m heart_risk.eda
      - run: python -m heart_risk.train 2>&1 | tee reports/train.log
      - run: python -m heart_risk.inference
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: experiment
          retention-days: 30
          path: |
            models/
            reports/
            mlflow.db
            mlartifacts/
            data/manifest.json

  container:
    needs: train
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: experiment
          path: .
      - name: Build the packaged model image
        run: docker build --tag heart-risk:tested . 2>&1 | tee reports/docker-build.log
      - name: Verify isolated serving
        run: |
          docker run -d --name heart-risk-smoke -p 127.0.0.1:8000:8000 heart-risk:tested
          VERSION=$(python -c "import json; print(json.load(open('models/metadata.json'))['model_version'])")
          python scripts/verify_api.py --expected-version "$VERSION" --output reports/evidence/container.json
      - name: Publish the same tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}-${GITHUB_RUN_ID}"
          docker tag heart-risk:tested "$IMAGE"
          docker push "$IMAGE" 2>&1 | tee reports/docker-push.log
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")
          python scripts/release.py --image "$DIGEST" --output reports/evidence/release.json
      - name: Preserve container logs
        if: always()
        run: docker logs heart-risk-smoke > reports/container.log 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: delivery-evidence
          path: |
            reports/docker-*.log
            reports/container.log
            reports/evidence/
      - name: Remove test container
        if: always()
        run: docker rm -f heart-risk-smoke || true